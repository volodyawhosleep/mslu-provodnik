<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1a2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Проводник МГЛУ">
  <title>Проводник МГЛУ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <button id="backBtn" class="icon-btn hidden" type="button" aria-label="Назад">‹</button>
      <div class="titles">
        <div class="eyebrow">МГЛУ</div>
        <h1 id="pageTitle">Проводник</h1>
      </div>
    </header>

    <section id="installHint" class="hint hidden">
      На iPhone: Поделиться → «На экран Домой» — иконка появится рядом с приложениями.
      <button id="dismissHint" type="button">Понятно</button>
    </section>

    <section id="searchWrap" class="search-wrap">
      <input id="search" type="search" enterkeyhint="search" placeholder="Найти аудиторию, столовую, зал…" autocomplete="off">
    </section>

    <main id="homeView" class="view"></main>
    <main id="buildingView" class="view hidden"></main>
    <main id="mapView" class="view hidden">
      <div id="mapMeta" class="map-meta"></div>
      <div id="floorChips" class="chips"></div>
      <div id="viewport" class="viewport">
        <img id="plan" alt="План этажа">
      </div>
      <p id="mapHint" class="fine">Щипком можно приблизить план. Номера комнат подписаны на карте.</p>
    </main>
    <main id="resultsView" class="view hidden"></main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
